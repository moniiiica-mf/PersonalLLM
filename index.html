<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal LLM</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">

    <!-- Top bar (visible in chat mode) -->
    <header id="topBar" class="top-bar hidden" role="banner">
      <button id="newChatBtn" class="icon-btn" aria-label="New chat" title="New chat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
      </button>
      <h1 class="top-bar-title">My Personal LLM</h1>
      <button id="settingsBtnTop" class="icon-btn" aria-label="Settings" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.32 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- Landing screen -->
    <main id="landing" class="landing" role="main">
      <div class="landing-content">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <h1 class="brand-title">My Personal LLM</h1>
          <p class="brand-tagline">Ask anything. Private. Local.</p>
        </div>

        <div class="chips" role="list" aria-label="Suggested prompts">
          <button class="chip" role="listitem" data-prompt="Explain design research in one sentence">
            Explain design research in one sentence
          </button>
          <button class="chip" role="listitem" data-prompt="What's a wicked problem?">
            What's a wicked problem?
          </button>
          <button class="chip" role="listitem" data-prompt="Write a polite email to a professor">
            Write a polite email to a professor
          </button>
          <button class="chip" role="listitem" data-prompt="Summarize this text: …">
            Summarize this text: &hellip;
          </button>
        </div>
      </div>
    </main>

    <!-- Chat screen -->
    <div id="chatScreen" class="chat-screen hidden">
      <div id="messages" class="messages" role="log" aria-label="Chat messages" aria-live="polite">
        <!-- Messages rendered here by JS -->
      </div>
    </div>

    <!-- Composer (always at bottom) -->
    <footer id="composer" class="composer" role="form" aria-label="Message input">
      <div class="composer-inner">
        <label for="msgInput" class="sr-only">Type your message</label>
        <textarea
          id="msgInput"
          class="msg-input"
          placeholder="Send a message…"
          rows="1"
          aria-label="Message"
        ></textarea>
        <button id="sendBtn" class="send-btn" aria-label="Send message" title="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="composer-footer">
        <button id="settingsBtnLanding" class="settings-toggle" aria-label="Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.32 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span>Settings</span>
        </button>
        <span class="mode-label" id="modeLabel">Local Basic Brain</span>
      </div>
    </footer>

    <!-- Settings panel (overlay) -->
    <div id="settingsOverlay" class="settings-overlay hidden" role="dialog" aria-label="Settings" aria-modal="true">
      <div class="settings-panel">
        <div class="settings-header">
          <h2>Settings</h2>
          <button id="closeSettings" class="icon-btn" aria-label="Close settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="settings-body">
          <div class="setting-row">
            <div class="setting-info">
              <label for="apiToggle" class="setting-label">Use API</label>
              <p class="setting-desc">Send messages to a backend LLM endpoint instead of the local basic brain.</p>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="apiToggle">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div id="apiSettings" class="api-settings hidden">
            <label for="apiEndpoint" class="setting-label">API Endpoint</label>
            <input
              type="url"
              id="apiEndpoint"
              class="text-input"
              value="http://localhost:8080/chat"
              placeholder="http://localhost:8080/chat"
            >
          </div>
        </div>
      </div>
    </div>

    <!-- Toast container -->
    <div id="toastContainer" class="toast-container" aria-live="assertive"></div>

  </div>

  <script src="app.js"></script>
</body>
</html>
